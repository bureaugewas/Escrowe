# Columns containing personal or GDPR-sensitive data, overlaid on the
# database explorer and masked in previews and query results.
#
# Categories: personal_name, contact, financial, health, location
#
# Alternative: instead of (or in addition to) this file, create a table
# inside your DuckDB file called
#   pii_registry(table_name VARCHAR, column_name VARCHAR, category VARCHAR)
# Escrow merges both sources.

pii_columns:
  employees:
    name: personal_name
    salary: financial
  customers:
    name: personal_name
  payroll:
    gross: financial
    net: financial
  health_proxy:
    indicator: health
