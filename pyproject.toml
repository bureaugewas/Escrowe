[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escrowe"
version = "0.1.0"
description = "A blind-agent query gateway: an LLM writes SQL against your schema, as a real database account, and never sees a row of the data."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jurjen van Genugten"}]
keywords = ["llm", "sql", "database", "agent", "privacy", "text-to-sql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
]
# Pinned exactly. The guard in escrowe/guard.py depends on sqlglot parsing
# every dialect's statement shapes as expected, so a version bump is a
# deliberate step: bump, run the suite, then commit. CI runs pip-audit weekly
# so a CVE disclosed against a pin is still caught.
dependencies = [
  "sqlglot==30.18.0",
  "pyarrow==25.0.1",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "typer==0.27.2",
  "rich==15.0.0",
  "anthropic==1.7.0",
  "openai==3.19.0",
  "pymysql==1.2.3",
  "psycopg[binary]==3.3.6",
  "pymssql==2.4.1",
  "duckdb==1.5.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pip-audit==2.10.1", "ruff==0.16.8"]

[project.urls]
Homepage = "https://github.com/bureaugewas/Escrowe"
Issues = "https://github.com/bureaugewas/Escrowe/issues"

[project.scripts]
escrowe = "escrowe.cli:app"

[tool.setuptools.packages.find]
include = ["escrowe*"]

[tool.setuptools.package-data]
escrowe = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B904"]   # B008: typer.Option() defaults; B904: `raise X(str(e))` is deliberate
