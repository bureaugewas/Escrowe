<svg viewBox="0 0 520 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Escrowe architecture: the human sends a question down to Escrowe, which sees only the database schema and sends SQL down to the database; rows flow straight back up to the human.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9488"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d4a94f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="520" height="760" fill="#2b2e36"/>

  <!-- Title -->
  <text x="260" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f3ede1">Escrowe</text>
  <text x="260" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a9488">blind-agent query gateway</text>

  <!-- Human -->
  <rect x="170" y="110" width="180" height="80" rx="10" fill="#2b2e36" stroke="#c8c2b4" stroke-width="2"/>
  <text x="260" y="157" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f3ede1">Human</text>

  <!-- Escrowe block -->
  <rect x="130" y="320" width="260" height="220" rx="14" fill="#383c46" stroke="#6b6f7a" stroke-width="2.5"/>
  <text x="260" y="352" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f3ede1">Escrowe</text>

  <!-- Agent sub-block -->
  <rect x="165" y="368" width="190" height="70" rx="8" fill="#454955" stroke="#8a8d97" stroke-width="1.5"/>
  <text x="260" y="399" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f3ede1">Agent</text>
  <text x="260" y="418" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#d4a94f">schema only</text>

  <text x="260" y="465" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#a5a0b0">guard · engine</text>
  <text x="260" y="500" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f3ede1">never row data</text>

  <!-- Database -->
  <rect x="170" y="620" width="180" height="90" rx="10" fill="#383c46"/>
  <text x="260" y="672" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f3ede1">Database</text>

  <!-- Human -> Escrowe : question -->
  <line x1="260" y1="190" x2="260" y2="318" stroke="#9a9488" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="228" y="243" width="64" height="20" fill="#2b2e36"/>
  <text x="260" y="258" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c8c2b4">question</text>

  <!-- Escrowe -> Database : SQL -->
  <line x1="260" y1="540" x2="260" y2="618" stroke="#9a9488" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="215" y="568" width="90" height="20" fill="#2b2e36"/>
  <text x="260" y="583" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#c8c2b4">checked SQL</text>

  <!-- Database -> Agent : schema -->
  <path d="M170,650 C80,570 80,450 163,400" fill="none" stroke="#9a9488" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <rect x="30" y="515" width="54" height="20" fill="#2b2e36"/>
  <text x="57" y="530" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c8c2b4">schema</text>

  <!-- Database -> Human : rows -->
  <path d="M350,650 C460,470 460,270 330,155" fill="none" stroke="#d4a94f" stroke-width="3" marker-end="url(#arrowAccent)"/>
  <rect x="412" y="398" width="46" height="24" fill="#2b2e36"/>
  <text x="435" y="415" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#d4a94f">rows</text>
</svg>
