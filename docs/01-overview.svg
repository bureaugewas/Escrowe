<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8442b"/>
    </marker>
  </defs>
  <rect width="900" height="350" fill="#ffffff"/>
  <g transform="translate(0 -20)">

  <!-- person -->
  <rect x="20" y="145" width="140" height="70" rx="10" fill="#eef3f8" stroke="#4c6a8a" stroke-width="1.5"/>
  <text x="90" y="175" text-anchor="middle" font-weight="600" fill="#1f2933">You</text>
  <text x="90" y="195" text-anchor="middle" fill="#5c6b7a" font-size="12">or your script</text>

  <!-- escrowe -->
  <rect x="280" y="60" width="250" height="240" rx="12" fill="#f6f8fa" stroke="#2a78d6" stroke-width="2"/>
  <text x="405" y="95" text-anchor="middle" font-weight="700" font-size="16" fill="#2a78d6">Escrowe</text>
  <rect x="300" y="120" width="210" height="34" rx="6" fill="#ffffff" stroke="#c7d2de"/>
  <text x="405" y="142" text-anchor="middle" fill="#1f2933">guard: one read-only statement</text>
  <rect x="300" y="166" width="210" height="34" rx="6" fill="#ffffff" stroke="#c7d2de"/>
  <text x="405" y="188" text-anchor="middle" fill="#1f2933">audit log + LLM transcript</text>
  <rect x="300" y="212" width="210" height="34" rx="6" fill="#ffffff" stroke="#c7d2de"/>
  <text x="405" y="234" text-anchor="middle" fill="#1f2933">schema, read once at connect</text>

  <!-- agent -->
  <rect x="710" y="40" width="170" height="80" rx="10" fill="#fff4ec" stroke="#d95926" stroke-width="1.5"/>
  <text x="795" y="75" text-anchor="middle" font-weight="600" fill="#1f2933">LLM agent</text>
  <text x="795" y="95" text-anchor="middle" fill="#5c6b7a" font-size="12">Claude</text>

  <!-- database -->
  <rect x="710" y="240" width="170" height="80" rx="10" fill="#edf7f2" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="795" y="275" text-anchor="middle" font-weight="600" fill="#1f2933">Your database</text>
  <text x="795" y="295" text-anchor="middle" fill="#5c6b7a" font-size="12">connected as your account</text>

  <g stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)">
    <!-- you <-> escrowe -->
    <line x1="160" y1="165" x2="280" y2="165"/>
    <line x1="280" y1="195" x2="160" y2="195"/>
    <!-- escrowe <-> agent -->
    <line x1="530" y1="72" x2="710" y2="72"/>
    <line x1="710" y1="105" x2="530" y2="105"/>
    <!-- escrowe <-> database -->
    <line x1="530" y1="255" x2="710" y2="255"/>
    <line x1="710" y1="288" x2="530" y2="288"/>
  </g>
  <g font-size="12" fill="#3b4a5a" text-anchor="middle">
    <text x="220" y="156">question or SQL</text>
    <text x="220" y="213">rows</text>
    <text x="620" y="63">schema + shape feedback</text>
    <text x="620" y="123">SQL</text>
    <text x="620" y="246">SQL, as your account</text>
    <text x="620" y="306">rows</text>
  </g>

  <!-- database -> agent: never -->
  <line x1="795" y1="240" x2="795" y2="120" stroke="#c8442b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
  <line x1="780" y1="195" x2="810" y2="165" stroke="#c8442b" stroke-width="3"/>
  <line x1="780" y1="165" x2="810" y2="195" stroke="#c8442b" stroke-width="3"/>
  <text x="820" y="185" font-size="12" font-weight="600" fill="#c8442b">rows never</text>

  <text x="20" y="352" font-size="12" fill="#5c6b7a">Escrowe adds no permissions of its own: the connected account's grants decide what can be read. Escrowe only keeps the rows away from the agent.</text>
  </g>
</svg>
