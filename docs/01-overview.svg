<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8442b"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="600" fill="#1f2933">1. The big picture: who sees what</text>

  <!-- person -->
  <rect x="40" y="170" width="150" height="70" rx="10" fill="#eef3f8" stroke="#4c6a8a" stroke-width="1.5"/>
  <text x="115" y="200" text-anchor="middle" font-weight="600" fill="#1f2933">You</text>
  <text x="115" y="220" text-anchor="middle" fill="#5c6b7a" font-size="12">or your script</text>

  <!-- escrowe -->
  <rect x="320" y="110" width="250" height="190" rx="12" fill="#f6f8fa" stroke="#2a78d6" stroke-width="2"/>
  <text x="445" y="140" text-anchor="middle" font-weight="700" font-size="16" fill="#2a78d6">Escrowe</text>
  <rect x="340" y="160" width="210" height="34" rx="6" fill="#ffffff" stroke="#c7d2de"/>
  <text x="445" y="182" text-anchor="middle" fill="#1f2933">guard: one read-only statement</text>
  <rect x="340" y="204" width="210" height="34" rx="6" fill="#ffffff" stroke="#c7d2de"/>
  <text x="445" y="226" text-anchor="middle" fill="#1f2933">audit log + LLM transcript</text>
  <rect x="340" y="248" width="210" height="34" rx="6" fill="#ffffff" stroke="#c7d2de"/>
  <text x="445" y="270" text-anchor="middle" fill="#1f2933">schema, read once at connect</text>

  <!-- agent -->
  <rect x="700" y="40" width="170" height="70" rx="10" fill="#fff4ec" stroke="#d95926" stroke-width="1.5"/>
  <text x="785" y="70" text-anchor="middle" font-weight="600" fill="#1f2933">LLM agent</text>
  <text x="785" y="90" text-anchor="middle" fill="#5c6b7a" font-size="12">Claude</text>

  <!-- database -->
  <rect x="700" y="290" width="170" height="70" rx="10" fill="#edf7f2" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="785" y="320" text-anchor="middle" font-weight="600" fill="#1f2933">Your database</text>
  <text x="785" y="340" text-anchor="middle" fill="#5c6b7a" font-size="12">connected as your account</text>

  <!-- you <-> escrowe -->
  <line x1="190" y1="190" x2="320" y2="190" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="182" text-anchor="middle" font-size="12" fill="#3b4a5a">question or SQL</text>
  <line x1="320" y1="225" x2="190" y2="225" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="243" text-anchor="middle" font-size="12" fill="#3b4a5a">rows</text>

  <!-- escrowe <-> agent -->
  <line x1="570" y1="140" x2="700" y2="80" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="92" font-size="12" fill="#3b4a5a">schema + shape feedback</text>
  <line x1="700" y1="100" x2="570" y2="165" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="150" font-size="12" fill="#3b4a5a">SQL</text>

  <!-- escrowe <-> database -->
  <line x1="570" y1="250" x2="700" y2="310" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="586" y="270" font-size="12" fill="#3b4a5a">SQL, as your account</text>
  <line x1="700" y1="335" x2="570" y2="285" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="330" font-size="12" fill="#3b4a5a">rows</text>

  <!-- database -> agent: never -->
  <line x1="785" y1="290" x2="785" y2="110" stroke="#c8442b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
  <line x1="770" y1="215" x2="800" y2="185" stroke="#c8442b" stroke-width="3"/>
  <line x1="770" y1="185" x2="800" y2="215" stroke="#c8442b" stroke-width="3"/>
  <text x="810" y="205" font-size="12" font-weight="600" fill="#c8442b">rows never</text>

  <text x="20" y="380" font-size="12" fill="#5c6b7a">Escrowe adds no permissions of its own: the connected account's grants decide what can be read. Escrowe only keeps the rows away from the agent.</text>
</svg>
