<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8442b"/>
    </marker>
  </defs>
  <rect width="900" height="700" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="600" fill="#1f2933">3. One question: what Escrowe.ask() does, step by step</text>

  <!-- column headers -->
  <g font-size="12" font-weight="600" fill="#5c6b7a">
    <text x="130" y="62" text-anchor="middle">service.py</text>
    <text x="450" y="62" text-anchor="middle">agent.py · guard.py</text>
    <text x="770" y="62" text-anchor="middle">engines/ · the database</text>
  </g>
  <line x1="290" y1="70" x2="290" y2="640" stroke="#e1e6ec" stroke-dasharray="4 4"/>
  <line x1="610" y1="70" x2="610" y2="640" stroke="#e1e6ec" stroke-dasharray="4 4"/>

  <!-- step 1 -->
  <rect x="30" y="80" width="200" height="54" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="130" y="102" text-anchor="middle" font-weight="600" fill="#1f2933">ask(principal, question)</text>
  <text x="130" y="122" text-anchor="middle" fill="#5c6b7a" font-size="11">same question as before? replay it</text>

  <!-- step 2 -->
  <line x1="130" y1="134" x2="130" y2="160" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="30" y="160" width="200" height="54" rx="8" fill="#ffffff" stroke="#4c6a8a" stroke-width="1.5"/>
  <text x="130" y="182" text-anchor="middle" font-weight="600" fill="#1f2933">schema_for(principal)</text>
  <text x="130" y="202" text-anchor="middle" fill="#5c6b7a" font-size="11">cached at connect, no new catalog read</text>

  <!-- loop box -->
  <rect x="20" y="240" width="860" height="330" rx="10" fill="none" stroke="#c7d2de" stroke-dasharray="6 4"/>
  <text x="34" y="260" font-size="12" font-weight="600" fill="#5c6b7a">LOOP · up to agent_attempts (default 3)</text>

  <!-- step 3: propose -->
  <line x1="130" y1="214" x2="130" y2="280" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="30" y="280" width="200" height="54" rx="8" fill="#ffffff" stroke="#4c6a8a" stroke-width="1.5"/>
  <text x="130" y="302" text-anchor="middle" font-weight="600" fill="#1f2933">build the prompt</text>
  <text x="130" y="322" text-anchor="middle" fill="#5c6b7a" font-size="11">schema + history + earlier attempts</text>

  <line x1="230" y1="307" x2="350" y2="307" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="280" width="200" height="54" rx="8" fill="#fff4ec" stroke="#d95926" stroke-width="1.5"/>
  <text x="450" y="302" text-anchor="middle" font-weight="600" fill="#1f2933">agent.propose()</text>
  <text x="450" y="322" text-anchor="middle" fill="#5c6b7a" font-size="11">LLM call, written to the transcript</text>

  <!-- parse -->
  <line x1="450" y1="334" x2="450" y2="360" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="360" width="200" height="44" rx="8" fill="#ffffff" stroke="#4c6a8a" stroke-width="1.5"/>
  <text x="450" y="387" text-anchor="middle" font-weight="600" fill="#1f2933">parse_reply()</text>

  <!-- prose branch -->
  <line x1="350" y1="382" x2="230" y2="382" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="374" text-anchor="middle" font-size="11" fill="#5c6b7a">prose</text>
  <rect x="30" y="360" width="200" height="44" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="130" y="379" text-anchor="middle" font-weight="600" fill="#1f2933">Answer</text>
  <text x="130" y="396" text-anchor="middle" fill="#5c6b7a" font-size="11">audit "answered", return words</text>

  <!-- sql branch: guard -->
  <line x1="450" y1="404" x2="450" y2="430" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="422" font-size="11" fill="#5c6b7a">SQL</text>
  <rect x="350" y="430" width="200" height="54" rx="8" fill="#ffffff" stroke="#4c6a8a" stroke-width="1.5"/>
  <text x="450" y="452" text-anchor="middle" font-weight="600" fill="#1f2933">guard.check(allow_write=False)</text>
  <text x="450" y="472" text-anchor="middle" fill="#5c6b7a" font-size="11">one statement, a read, no blocked built-in</text>

  <!-- execute -->
  <line x1="550" y1="457" x2="670" y2="457" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="610" y="449" text-anchor="middle" font-size="11" fill="#5c6b7a">ok</text>
  <rect x="670" y="430" width="200" height="54" rx="8" fill="#edf7f2" stroke="#1baf7a" stroke-width="1.5"/>
  <text x="770" y="452" text-anchor="middle" font-weight="600" fill="#1f2933">engine.execute(sql)</text>
  <text x="770" y="472" text-anchor="middle" fill="#5c6b7a" font-size="11">as the connected account → Arrow table</text>

  <!-- feedback: denied / error -->
  <path d="M450,484 L450,520 L130,520 L130,334" fill="none" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="512" text-anchor="middle" font-size="11" fill="#5c6b7a">denied or SQL error → feedback text, next attempt</text>

  <!-- probe feedback -->
  <path d="M770,484 L770,548 L130,548" fill="none" stroke="#3b4a5a" stroke-width="1.5"/>
  <line x1="130" y1="548" x2="130" y2="336" stroke="none"/>
  <text x="450" y="541" text-anchor="middle" font-size="11" fill="#5c6b7a">probe? → shape only ("12 rows, col x all NULL"), next attempt</text>

  <!-- result out -->
  <line x1="770" y1="484" x2="770" y2="610" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="590" font-size="11" fill="#5c6b7a">final</text>
  <rect x="670" y="610" width="200" height="54" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="770" y="632" text-anchor="middle" font-weight="600" fill="#1f2933">QueryResult → caller</text>
  <text x="770" y="652" text-anchor="middle" fill="#5c6b7a" font-size="11">audit "allowed"; remember SQL + shape</text>

  <!-- never to agent -->
  <line x1="670" y1="637" x2="560" y2="637" stroke="#c8442b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
  <line x1="600" y1="622" x2="625" y2="652" stroke="#c8442b" stroke-width="3"/>
  <line x1="600" y1="652" x2="625" y2="622" stroke="#c8442b" stroke-width="3"/>
  <text x="450" y="641" text-anchor="middle" font-size="12" font-weight="600" fill="#c8442b">rows never go back to the agent</text>

  <text x="20" y="690" font-size="11" fill="#5c6b7a">sql() is the same path from guard.check onwards, with allow_write=True, for SQL a person typed themselves.</text>
</svg>
